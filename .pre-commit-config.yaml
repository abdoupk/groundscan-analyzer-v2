# Every gate runs in this repository's own environment via `uv run --frozen`, so
# there is one runner and one resolved dependency set. `language: system` is what
# buys that: the default would build an isolated virtualenv per hook and install
# ruff, mypy and pytest again on every commit.
#
# Order is cheap-first, and it is part of the bar (see issue #83): the cheapest
# failure should be the one discovered first. Format and lint cost milliseconds,
# pytest and the map check cost seconds, mutation testing costs minutes.
#
# Run the manual stage on demand:  uv run pre-commit run --hook-stage manual --all-files
#
# One consequence of pre-commit's model worth knowing: unstaged changes are stashed
# before the hooks run, so a hook that takes no filenames sees the *staged* tree.
# That is the right behaviour for a commit gate, and it is why the map check is
# allowed to call the network - its subject is the relationship between this
# repository and the tracker, not the contents of a file.

minimum_pre_commit_version: "4.0.0"

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --no-fix
        language: system
        pass_filenames: false

      - id: vulture
        name: vulture
        entry: uv run --frozen vulture src
        language: system
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run --frozen pytest
        language: system
        pass_filenames: false

      # A workspace member is a second distribution with its own gates. Ruff
      # reaches packages/ on its own (it resolves each file against that
      # package's own pyproject.toml), but mypy, pytest and deptry are all
      # scoped to the root, so without these a package could ship with a
      # failing typecheck, a failing suite, or an undeclared import. One
      # entry per tool per member, run with --directory so the member's own
      # config is the one that applies.
      - id: record-mypy
        name: mypy (groundscan-record)
        entry: uv run --frozen --directory packages/groundscan-record mypy
        language: system
        pass_filenames: false
        always_run: true

      - id: record-pytest
        name: pytest (groundscan-record)
        entry: uv run --frozen --directory packages/groundscan-record pytest
        language: system
        pass_filenames: false
        always_run: true

      - id: record-deptry
        name: deptry (groundscan-record)
        entry: uv run --frozen --directory packages/groundscan-record deptry .
        language: system
        pass_filenames: false
        always_run: true

      - id: tui-mypy
        name: mypy (groundscan-tui)
        entry: uv run --frozen --directory packages/groundscan-tui mypy
        language: system
        pass_filenames: false
        always_run: true

      - id: tui-pytest
        name: pytest (groundscan-tui)
        entry: uv run --frozen --directory packages/groundscan-tui pytest
        language: system
        pass_filenames: false
        always_run: true

      - id: tui-deptry
        name: deptry (groundscan-tui)
        entry: uv run --frozen --directory packages/groundscan-tui deptry .
        language: system
        pass_filenames: false
        always_run: true

      - id: map-check
        name: map body vs tracker
        entry: python scripts/check_map.py
        language: system
        pass_filenames: false
        always_run: true

      # deptry is the dependency gate. The #19 verdicts have reached
      # pyproject.toml, so a declared-but-unimported package is a defect and
      # deptry runs on the commit path. The admitted-but-not-yet-imported set
      # is scoped in [tool.deptry.per_rule_ignores]; anything else unimported
      # fails the commit.
      - id: deptry
        name: deptry
        entry: uv run --frozen deptry .
        language: system
        pass_filenames: false
        always_run: true

      # Mutation testing and the CVE scan are gates, but they cost minutes and
      # the second needs the network, so they are not on the commit path.
      - id: gremlins
        name: pytest --gremlins
        entry: uv run --frozen pytest --gremlins --no-cov
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: pip-audit
        name: pip-audit
        entry: uv run --frozen pip-audit -r audit-requirements.txt --disable-pip
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
